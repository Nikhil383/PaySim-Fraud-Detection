[project]
name = "fraud-capstone"
version = "0.1.0"
description = "PaySim Fraud Detection Capstone Project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
]
tracking = [
    "mlflow>=2.8.0",
]
monitoring = [
    "evidently>=0.4.0",
]
streaming = [
    "kafka-python>=2.0.2",
]
graph = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
]
all = [
    "fraud-capstone[dev,tracking,monitoring,streaming,graph]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
