apiVersion: apps/v1
kind: Deployment
metadata:
  name: paysim-fraud-api
  labels:
    app: paysim-fraud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paysim-fraud-api
  template:
    metadata:
      labels:
        app: paysim-fraud-api
    spec:
      containers:
      - name: fraud-api
        image: paysim-fraud-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paysim-fraud-api-service
spec:
  selector:
    app: paysim-fraud-api
  type: NodePort
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
